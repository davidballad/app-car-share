services:
  # Backend API
  - type: web
    name: ecuador-rideshare-api
    env: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ecuador-rideshare-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 10000

databases:
  # PostgreSQL Database
  - name: ecuador-rideshare-db
    databaseName: ecuador_rideshare
    user: ecuador_user
    plan: free
    region: oregon